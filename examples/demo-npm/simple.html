<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thirstie SDK Demo</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header class="header-container" class="th-fouc-block">
      <nav class="navbar">
        <div class="navbar-nav">
          <a href="/"><span><img src="https://media.thirstie.cloud/content/2Dt1hdN5CDkHNn7UBCQ5yH,x60f.png" /></span></a>
        </div>
        <div class="navbar-cta">
            <th-cart-nav></th-cart-nav>
        </div>
        <div class="navbar-title">
          <span>This site is for <strong>demonstration</strong> purposes only</span>
        </div>
      </nav>
      <th-zipcode-check></th-zipcode-check>
    </header>

    <th-product-container></th-product-container>

    <th-agegate-modal type="dob" class="th-fouc-block">
      <span slot="header">Welcome! Can we see some ID?</span>
      <div slot="additional-msg">
        <div>For information about enjoying Alcohol RESPONSIBLY visit <a href="https://responsibility.org">responsibility.org</a> & <a href="https://responsibledrinking.org">responsibledrinking.org</a></div>
      </div>
      <div slot="fail-msg">You must 21 or older to enter. Click <a href="https://responsibility.org" target="_blank">here</a></div>
    </th-agegate-modal>

    <script src="./index.js" type="module"></script>

  </body>
</html>
