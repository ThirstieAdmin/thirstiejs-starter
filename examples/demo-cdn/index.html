<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo</title>

    <!-- BEGIN THIRSTIE SDK CODE -->
    <link rel="stylesheet" type="text/css" href="https://cdn.thirstie.cloud/css/latest/thirstiebase.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.thirstie.cloud/css/latest/thirstieecomm.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.thirstie.cloud/js/v1.4.1/thirstie-ecomm-vue.js"></script>

    <script defer type="module">
      const getCredentials = () => {

        // Your api keys
        // Before going live, you will receive a production api key
        const myCredentials =  {
          "APIKEY": "oc6CHBQk6FAZeFEAeSWoJo",
          "MAPSKEY": "AIzaSyCnaUMiemfrsQ8QvqdfbKIoeSoT64R5s4w",
          "THENV": "sandbox"
        };

        const { APIKEY, MAPSKEY, THENV } = myCredentials;
        window.thirstieEcommVue.initApp({
            APIKEY: APIKEY,
            MAPSKEY: MAPSKEY,
            environment: THENV,
            experimental: false,
            featureFlags: {
                engraving: false
            },
            primaryColor: '#154D5B',
            secondaryColor: '#f0a0a0',
            primaryContrastingColor: '#fff',
            secondaryContrastingColor: '#000',
            routes: {
                checkout: '/checkout.html',
                shopping: '/'
            },
            brandLogo:
                'https://media.thirstie.cloud/content/2Dt1hdN5CDkHNn7UBCQ5yH,x250f.png'
        });
      }

      globalThis.__VUE_PROD_DEVTOOLS__ = false;
      globalThis.__VUE_PROD_HYDRATION_MISMATCH_DETAILS__ = false;
      globalThis.__VUE_OPTIONS_API__ = false;
      getCredentials();
    </script>
    <!-- END THIRSTIE SDK CODE -->

    <!-- Or specify CSS in <style /> tag -->
    <style>
      body {
          margin: 0;
          display: flex;
          place-items: center;
          min-width: 300px;
          min-height: 80vh;
      }

      header {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          width: 100%;
      }

      .content {
          position:absolute;
          top: 68px;
          left: 0;
          display: block;
          padding: 0;
          margin: 0;
          background-color: #fff;
      }

      .header-container {
          line-height: 1rem;
          margin: 0 auto;
          z-index: 1000000;
          color: #000;
          background-color: #fff;
          border-bottom: var(--th-header-dividers);
      }

      .navbar {
          display: inline-block;
          width: 100%;
          height: 3rem;
          padding: .5rem 1rem;
      }

      .navbar-nav {
          min-height: 2rem;
          float: left;
      }

      .navbar-nav img {
          height: 2rem;
          vertical-align: middle;
      }

      .navbar-cta {
          float: right;
          padding: 0 2rem;
      }

      .navbar-title {
          margin: 0 auto;
          text-align: center;
          line-height: 2rem;
          vertical-align: middle;
      }

      .navbar-link {
          padding:0 3rem;
          color:#154D5B;
          text-decoration: none;
          font-weight: bold;
          text-align: center;
          line-height: 2rem;
          vertical-align: middle;
      }

      .page-content {
          display: grid;
          grid-template-columns: 1fr 1fr;
          margin: 0 2rem;
      }

      @media screen and (max-width: 768px) {
          .page-content {
              grid-template-columns: 1fr;
              margin: 0 1rem;
          }
      }

    </style>
  </head>

  <body>

    <header id="app-header" class="header-container">  <!-- Your standard navigation bar header -->
      <nav class="navbar">
        <div class="container-fluid">
          <h4 style="text-align: center;margin:0;padding:0;"><span>This site is for <strong>demonstration</strong> purposes only</span></h4>
          <div class="navbar-nav">
            Thirstie Powered E-Commerce
          </div>
        </div>
        <div class="navbar-cta">
          <!-- Thirstie Custom component placing the shopping cart icon in the header -->
          <!-- th-header-nav also enables a slide in drawer to preview shopping cart details -->
          <th-cart-nav></th-cart-nav>
        </div>
      </nav>
    </header>

    <!-- Adding th-fouc-block to a component will prevent a "flash of unrendered content" -->
    <div class="content th-fouc-block">
      <!-- Add a component to allow the user to specify their zip code in order to determine product availability -->
      <th-availability-wrapper header-height="65" check-type="address">
        <slot name="page-content">
          <div class="page-content">
            <th-product-container></th-product-container>
          </div>
        </slot>
      </th-availability-wrapper>
    </div>

  </body>
</html>
