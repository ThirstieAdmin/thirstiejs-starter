<!-- index.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thirstie Demo</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.thirstie.cloud/css/latest/thirstiebase.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.thirstie.cloud/css/latest/thirstieecomm.css"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>

  <body>
    <header class="header-container">  <!-- Your standard navigation bar header -->
        <nav class="navbar">
            <div class="container-fluid">
                <div class="navbar-nav">
                  Thirstie Powered E-Commerce
                </div>
            </div>
            <div class="navbar-cta">
              <!-- Thirstie Custom component placing the shopping cart icon in the header -->
              <!-- th-cart-nave also enables a slide in drawer to preview shopping cart details -->
              <th-header-nav></th-header-nav> 
            </div>
        </nav>
    </header>

    <div class="wrapper">
      <div class="content">
        <!-- Add a component to allow the user to specify their zip code in order to determine product availability -->
        <!-- You can specify either <th-zipcode-check /> or <th-address-check />-->
        <th-zipcode-check></th-zipcode-check>

        <!-- This section shows the use of product cards to selective highlight products-->
        <!-- The th-catalog-collection component is a container component that ensures the products reference by the products cards are loaded -->
        <th-catalog-collection>
          <h2 class="flex flex-row justify-center my-4">Featured Products</h2>
          <div class="flex flex-row my-4 gap-4 justify-around">
            <th-product-add-to-cart product-line-id="1042217" pdp-link="/pdp.html?plid=1042217" show-link link-text="Learn More"></th-product-add-to-cart>
            <th-product-add-to-cart product-line-id="1042215" pdp-link="/pdp.html?plid=1042215" show-link link-text="Learn More"></th-product-add-to-cart>
          </div>
        </th-catalog-collection>
        <hr />

        <div class="content">
          <h2 class="flex flex-row justify-center my-2">Complete Catalog</h2>
          <!-- The th-plp component displays a pre-built product listing component, and individul product detail views -->
          <th-plp></th-plp>
        </div>
      </div>

      <!-- Install age gate modal -->
      <th-agegate-modal type="dob" class="th-fouc-block">
        <span slot="header">Welcome! Can we see some ID?</span>
        <div slot="additional-msg">
          <div>For information about enjoying Alcohol RESPONSIBLY visit <a href="https://responsibility.org">responsibility.org</a> & <a href="https://responsibledrinking.org">responsibledrinking.org</a></div>
        </div>
        <div slot="fail-msg">You must 21 or older to enter. Click <a href="https://responsibility.org" target="_blank">here</a></div>
      </th-agegate-modal>

    </div>

    <script src="./index.js" type="module"></script>
  </body>
</html>
